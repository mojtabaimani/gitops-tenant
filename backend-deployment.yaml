apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: ghcr.io/tsclabs-eu/demo-app-backend:0.7.0
        name: demo-app-backend
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: jwt-secret
        resources: {}
status: {}
