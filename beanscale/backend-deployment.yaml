apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: ghcr.io/tsclabs-eu/demo-app-backend:0.7.0
        name: demo-app-backend
        ports:
        - containerPort: 8080
        env:
        - name: DISPATCH_EXECUTOR
          value: kubernetes
        - name: DISPATCH_SCHEDULER_INTERVAL
          value: 20s
        - name: DISPATCH_JOB_IMAGE
          value: ghcr.io/tsclabs-eu/demo-app-backend:0.6.0
        - name: DISPATCH_JOB_BACKEND_URL
          value: http://backend:8080
        envFrom:
        - secretRef:
            name: jwt-secret
        resources: {}
status: {}
