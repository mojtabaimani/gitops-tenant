apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy: {}
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: ghcr.io/tsclabs-eu/demo-app-frontend:0.7.0
        name: demo-app-frontend
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: jwt-secret
        - configMapRef:
            name: frontend-config
        resources: {}
status: {}
